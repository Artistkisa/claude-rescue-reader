name: Bug report / 错误报告
description: Report a reproducible problem using synthetic or fully redacted data / 使用合成或完全脱敏数据报告问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not upload real Claude exports, real conversation screenshots, credentials, tokens, account identifiers, or personal absolute paths.** Reduce the problem to synthetic data first.

        感谢反馈。**请勿上传真实 Claude 导出、真实对话截图、凭据、Token、账号标识或个人绝对路径。** 请先缩减为合成数据。

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: I confirm this report and its attachments contain only synthetic or fully redacted data. / 我确认本报告及附件只包含合成或完全脱敏的数据。
          required: true

  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
      description: For example v1.4 or a commit SHA.
      placeholder: v1.4
    validations:
      required: true

  - type: dropdown
    id: distribution
    attributes:
      label: Distribution / 发行方式
      options:
        - viewer.html
        - Offline bundle / 离线版
        - Current main / 当前 main
        - Other / 其他
    validations:
      required: true

  - type: dropdown
    id: import_method
    attributes:
      label: Import method / 导入方式
      options:
        - ZIP
        - Extracted folder / 解压目录
        - Drag and drop / 拖拽
        - Synthetic test only / 仅合成测试
        - Not related to import / 与导入无关
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and operating system / 浏览器与操作系统
      placeholder: Chrome 150, Windows 11
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened? / 发生了什么？
      description: Describe the visible problem and where it occurs.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction / 合成复现步骤
      description: Provide the smallest fictional JSON shape or numbered steps. Do not paste private history.
      placeholder: |
        1. Open viewer.html
        2. Import a synthetic ZIP containing ...
        3. Open ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics / 已脱敏诊断信息
      description: Optional console messages or screenshots containing synthetic data only.

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks / 最终检查
      options:
        - label: I searched existing issues and pull requests. / 我已搜索已有 Issue 和 PR。
          required: true
        - label: This is not an unpatched security vulnerability. / 这不是尚未修复的安全漏洞。
          required: true

