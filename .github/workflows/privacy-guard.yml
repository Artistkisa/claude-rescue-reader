name: Privacy Guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: privacy-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: Privacy Guard / scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan commits with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan added paths and lines
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run privacy
