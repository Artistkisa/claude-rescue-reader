name: Browser Smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: browser-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Browser Smoke / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Upload sanitized failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
