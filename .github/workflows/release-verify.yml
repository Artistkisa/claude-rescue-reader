name: Release Verify
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  artifact:
    name: Release Verify / artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - shell: pwsh
        run: ./scripts/build-single-file.ps1
      - run: npm run validate
      - run: npm run test:smoke
      - name: Build release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item viewer.html dist/viewer.html
          Compress-Archive -Path dist/viewer.html -DestinationPath dist/claude-rescue-reader.zip
          (Get-FileHash dist/viewer.html -Algorithm SHA256).Hash.ToLower() + '  viewer.html' | Set-Content dist/SHA256SUMS.txt
      - name: Verify package contents
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Select-Object -ExpandProperty Name
          if (Compare-Object @('SHA256SUMS.txt','claude-rescue-reader.zip','viewer.html') $files) { throw 'Unexpected release files' }
          $privatePathPatterns = @(
            '<<<<<<<|>>>>>>>'
            '[A-Za-z]:\\Users\\[^\\\s"''<>]+\\'
            '[A-Za-z]:\\Documents and Settings\\[^\\\s"''<>]+\\'
            '/Users/[A-Za-z0-9._-]+/'
            '/home/[A-Za-z0-9._-]+/'
          )
          if (Select-String -Path dist/viewer.html -Pattern $privatePathPatterns -Quiet) { throw 'Conflict marker or personal absolute path found in artifact' }
          Add-Type -AssemblyName System.IO.Compression
          $archive = $null
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/claude-rescue-reader.zip))
          try { $zipEntries = @($archive.Entries | ForEach-Object FullName) }
          finally { if ($archive) { $archive.Dispose() } }
          if ($zipEntries.Count -ne 1 -or $zipEntries[0] -ne 'viewer.html') { throw 'Unexpected ZIP contents' }
          $expected = ((Get-Content dist/SHA256SUMS.txt) -split '\s+')[0]
          $actual = (Get-FileHash dist/viewer.html -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw 'SHA-256 checksum mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: claude-rescue-reader-${{ github.ref_name }}
          path: dist/
          retention-days: 30
