name: Docs Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Docs Check / validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run docs
